<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyWeb Chat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root { --bg: #000; --sent: #1a1a1a; --rcvd: #050505; --text: #fff; --border: #222; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; font-weight: bold; letter-spacing: 1px; font-size: 1.1rem; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 12px 16px; border-radius: 18px; max-width: 80%; border: 1px solid var(--border); line-height: 1.4; }
        .sender { font-size: 10px; color: #666; display: block; margin-bottom: 4px; font-weight: bold; }
        .sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .rcvd { align-self: flex-start; background: var(--rcvd); border-bottom-left-radius: 2px; }
        #form { padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--border); background: #000; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        input { flex: 1; background: #111; border: 1px solid var(--border); color: #fff; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 16px; }
        button { background: #fff; color: #000; border: none; padding: 0 25px; border-radius: 25px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="header">MYWEB CHAT</div>
<div id="chat"></div>
<form id="form">
    <input type="text" id="input" placeholder="Message..." autocomplete="off">
    <button type="submit">SEND</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<script>
    const { Client, Databases, Account, ID, Query } = Appwrite;
    
    // 1. PROJECT CONFIG
    const client = new Client()
        .setEndpoint('https://cloud.appwrite.io/v1')
        .setProject('69cdb316003b87006984');

    const databases = new Databases(client);
    const account = new Account(client);
    
    const dbID = 'myweb_db';
    const colID = 'chat_messages';

    // 2. IDENTITY SETUP
    let user = localStorage.getItem('chat_user');
    if (!user) {
        user = prompt("Enter your display name:") || "Guest_" + Math.floor(Math.random() * 1000);
        localStorage.setItem('chat_user', user);
    }

    const chatDiv = document.getElementById('chat');
    const form = document.getElementById('form');

    // 3. UI RENDERING
    function renderMessage(doc) {
        const isMe = doc.sender === user;
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'sent' : 'rcvd'}`;
        div.innerHTML = `<span class="sender">${doc.sender}</span>${doc.text}`;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    // 4. MAIN INITIALIZATION
    async function init() {
        try {
            // Start Anonymous Session to fix 401 and "Region Access" errors
            try {
                await account.get();
            } catch {
                await account.createAnonymousSession();
            }

            // Load History
            const res = await databases.listDocuments(dbID, colID, [Query.orderAsc('timestamp')]);
            res.documents.forEach(renderMessage);

            // Subscribe to Realtime
            client.subscribe(`databases.${dbID}.collections.${colID}.documents`, res => {
                if (res.events.includes("databases.*.collections.*.documents.*.create")) {
                    renderMessage(res.payload);
                }
            });

        } catch(e) {
            console.error("Initialization failed:", e);
        }
    }

    // 5. SEND LOGIC
    form.onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('input');
        const text = input.value.trim();
        if (!text) return;

        try {
            await databases.createDocument(dbID, colID, ID.unique(), {
                text: text,
                sender: user,
                timestamp: Date.now()
            });
            input.value = '';
        } catch(e) {
            alert("Could not send message. Check collection attributes!");
            console.error(e);
        }
    };

    init();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    }
</script>
</body>
</html>
