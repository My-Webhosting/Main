<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyWeb Chat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root { --bg: #000; --sent: #1a1a1a; --rcvd: #050505; --text: #fff; --border: #222; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #header { padding: 15px; border-bottom: 1px solid var(--border); text-align: center; font-weight: bold; letter-spacing: 1px; }
        #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 80%; border: 1px solid var(--border); position: relative; }
        .sender { font-size: 10px; color: #666; display: block; margin-bottom: 4px; }
        .sent { align-self: flex-end; background: var(--sent); border-bottom-right-radius: 2px; }
        .rcvd { align-self: flex-start; background: var(--rcvd); border-bottom-left-radius: 2px; }
        #form { padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--border); background: #000; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        input { flex: 1; background: #111; border: 1px solid var(--border); color: #fff; padding: 12px; border-radius: 20px; outline: none; }
        button { background: #fff; color: #000; border: none; padding: 0 20px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">MYWEB CHAT</div>
<div id="chat"></div>
<form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button type="submit">SEND</button>
</form>

<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<script>
    const { Client, Databases, ID, Query } = Appwrite;
    const client = new Client()
        .setEndpoint('https://cloud.appwrite.io/v1')
        .setProject('69cdb316003b87006984');

    const databases = new Databases(client);
    const dbID = 'myweb_db';
    const colID = 'chat_messages';

    let user = localStorage.getItem('chat_user') || prompt("Username:") || "Guest";
    localStorage.setItem('chat_user', user);

    const chatDiv = document.getElementById('chat');
    const form = document.getElementById('form');

    function renderMessage(doc) {
        const isMe = doc.sender === user;
        const div = document.createElement('div');
        div.className = `msg ${isMe ? 'sent' : 'rcvd'}`;
        div.innerHTML = `<span class="sender">${doc.sender}</span>${doc.text}`;
        chatDiv.appendChild(div);
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    async function load() {
        try {
            const res = await databases.listDocuments(dbID, colID, [Query.orderAsc('timestamp')]);
            res.documents.forEach(renderMessage);
        } catch(e) { console.error(e); }
    }

    client.subscribe(`databases.${dbID}.collections.${colID}.documents`, res => {
        if (res.events.includes("databases.*.collections.*.documents.*.create")) {
            renderMessage(res.payload);
        }
    });

    form.onsubmit = async (e) => {
        e.preventDefault();
        const input = document.getElementById('input');
        if (!input.value) return;
        await databases.createDocument(dbID, colID, ID.unique(), {
            text: input.value,
            sender: user,
            timestamp: Date.now()
        });
        input.value = '';
    };

    load();
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
