<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Link to the Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Register the Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWeb | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <style>
        :root { --bg: #ffffff; --sidebar: #f4f4f4; --card: #ffffff; --text: #1a1a1a; --border: #ddd; }
        [data-theme="dark"] { --bg: #050505; --sidebar: #0a0a0a; --card: #111; --text: #ffffff; --border: #222; }
        
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; display: flex; transition: 0.3s; min-height: 100vh; }
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; }
        .logo-img { width: 140px; margin-bottom: 40px; }
        
        .main { flex: 1; padding: 40px; max-width: 1100px; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .stat-card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid var(--border); transition: 0.3s; }
        
        .btn { background: var(--text); color: var(--bg); border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        textarea { width: 100%; height: 100px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; margin-top: 15px; box-sizing: border-box; resize: none; }
        .nav-link { padding: 10px; color: var(--text); text-decoration: none; display: block; margin-bottom: 5px; opacity: 0.7; }
        .nav-link:hover { opacity: 1; }
    </style>
</head>
<body data-theme="dark">

<div class="sidebar">
   <a href="https://upload.wikimedia.org/wikipedia/commons/f/f5/Red-eyed_Leaf_Frog_%2849661076226%29.jpg"> <img id="logo" src="MYWEB2!.png" class="logo-img"> </a>
    <div style="flex:1">
        <a href="#" class="nav-link" style="font-weight:bold; opacity:1;">Overview</a>
        <a href="#" class="nav-link">My Sites</a>
        <a href="#" class="nav-link">Billing</a>
    </div>
    <button class="btn" onclick="toggleTheme()" style="background:var(--border); color:var(--text);">🌓 Switch Theme</button>
    <button onclick="logout()" style="background:transparent; color:#ff4444; border:none; margin-top:15px; cursor:pointer;">Sign Out</button>
</div>

<div class="main">
    <h1 id="welcome-title" style="font-size: 36px; margin-bottom: 10px;">...</h1>
    <p id="user-sub" style="color:gray; margin-bottom: 40px;"></p>

    <div class="stat-grid">
        <!-- Gems Card -->
        <div class="stat-card">
            <div style="font-size:12px; color:gray; letter-spacing:1px; font-weight:700;">CURRENT BALANCE</div>
            <div id="gem-count" style="font-size:48px; font-weight:900; margin:10px 0;">0</div>
            <div style="color:var(--text); font-size:14px;">💎 Gems Available</div>
        </div>

        <!-- Daily Bonus Card -->
        <div class="stat-card">
            <div style="font-size:12px; color:gray; letter-spacing:1px; font-weight:700;">DAILY REWARD</div>
            <div id="reward-status" style="font-size:20px; margin:20px 0; font-weight:600;">Checking...</div>
            <button id="claim-btn" class="btn" onclick="claimDaily()" style="display:none;">🎁 Claim 10 Gems</button>
        </div>

        <!-- Idea Incubator Card -->
        <div class="stat-card" style="grid-column: 1 / -1;">
            <div style="font-size:12px; color:gray; letter-spacing:1px; font-weight:700;">IDEA INCUBATOR</div>
            <p style="margin-top:10px; font-size:14px; opacity:0.8;">What should we build next? We turn your ideas into code.</p>
            <textarea id="idea-text" placeholder="I want to be able to host my own Python bots..."></textarea>
            <button id="idea-btn" class="btn" onclick="sendIdea()" style="width:auto; padding: 12px 40px;">Launch Idea 🚀</button>
        </div>
    </div>
</div>

<!-- Load the latest Appwrite SDK to ensure createPushTarget exists -->
<script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
<script>
    const { Client, Account, Databases, Query, ID, Messaging } = Appwrite;
    
    // 1. Initialize Appwrite
    const client = new Client()
        .setEndpoint('https://nyc.cloud.appwrite.io/v1')
        .setProject('69cdb316003b87006984');

    const account = new Account(client);
    const databases = new Databases(client);
    const messaging = new Messaging(client);

    let docId = null;
    let userName = "";

    // 2. Theme Engine
    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.body.setAttribute('data-theme', theme);
        const logo = document.getElementById('logo');
        if (logo) logo.src = theme === 'dark' ? 'MYWEB2!.png' : 'MYWEB!.png';
        localStorage.setItem('myweb_theme', theme);
    }

    if(localStorage.getItem('myweb_theme')) {
        const saved = localStorage.getItem('myweb_theme');
        document.body.setAttribute('data-theme', saved);
        const logo = document.getElementById('logo');
        if (logo) logo.src = saved === 'dark' ? 'MYWEB2!.png' : 'MYWEB!.png';
    }

    // 3. Main Init
    async function init() {
        try {
            const user = await account.get();
            userName = user.name;
            document.getElementById('welcome-title').innerText = `Hello, ${user.name}`;
            document.getElementById('user-sub').innerText = user.email;

            initPush().catch(e => console.warn("Push Setup Error:", e));

            const res = await databases.listDocuments('myweb_db', 'user_stats', [Query.equal('username', [user.name])]);
            if (res.documents.length > 0) {
                const data = res.documents[0];
                docId = data.$id;
                document.getElementById('gem-count').innerText = data.gems;
            }
        } catch (e) { 
            console.error(e);
            window.location.href = "login.html"; 
        }
    }

    // 4. The FIXED Manual Push Logic
    async function initPush() {
        if (!('serviceWorker' in navigator)) return;
        
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') return;

        const registration = await navigator.serviceWorker.ready;
        const VAPID_KEY = 'BPdw-evLUFEEKMvWvFiUu0ZPkhhrYLgYzO__UPMr1Qm51jTIvfirXCqKErVc947aC-CFEBi2qH_a-Qr3xre2UOk';

        const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: VAPID_KEY
        });

        const subData = JSON.parse(JSON.stringify(subscription));

        try {
            // WE USE THE FULL URL HERE to avoid the 405 error on GitHub
            const response = await fetch('https://nyc.cloud.appwrite.io/v1/messaging/targets/push', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Appwrite-Project': '69cdb316003b87006984' // Your Project ID
                },
                body: JSON.stringify({
                    targetId: ID.unique(),
                    providerId: '69d05307002111bd7314', // Your FCM Provider ID
                    identifier: subscription.endpoint,
                    subscribe: ['news', 'gems'],
                    publicKey: subData.keys.p256dh,
                    authSecret: subData.keys.auth
                })
            });

            if (response.ok) {
                console.log("Push System: Registered via Fetch ✅");
            } else {
                const errorData = await response.json();
                console.error("Push API Error:", errorData);
            }

        } catch (err) {
            console.error("Network Error:", err);
        }
    }

    // 5. Utility Functions
    async function claimDaily() {
        const currentGems = parseInt(document.getElementById('gem-count').innerText);
        try {
            await databases.updateDocument('myweb_db', 'user_stats', docId, {
                gems: currentGems + 10,
                last_claim: Date.now().toString()
            });
            location.reload();
        } catch (e) { alert(e.message); }
    }

    async function sendIdea() {
        const idea = document.getElementById('idea-text').value;
        if(!idea) return alert("Vision cannot be empty!");
        try {
            await databases.createDocument('myweb_db', 'user_ideas', ID.unique(), {
                "content": idea, "username": userName
            });
            alert("Idea Received!");
            document.getElementById('idea-text').value = "";
        } catch (e) { alert(e.message); }
    }

    async function logout() { 
        await account.deleteSession('current'); 
        window.location.href = "login.html"; 
    }

    init();
</script>
</body>
</html>
