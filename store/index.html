<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWeb App Store | Discover & Create</title>
    
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-text: #000000;
            --accent-blue: #2563eb;
            --bg-color: #ffffff;
            --card-bg: #fcfcfc;
            --border: #eeeeee;
            --hero-bg: radial-gradient(circle at center, #fafafa 0%, #ffffff 100%);
            --muted-text: #666;
        }

        [data-theme="dark"] {
            --primary-text: #ffffff;
            --accent-blue: #3b82f6;
            --bg-color: #0a0a0a;
            --card-bg: #16161a;
            --border: #27272a;
            --hero-bg: radial-gradient(circle at center, #111111 0%, #0a0a0a 100%);
            --muted-text: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            line-height: 1.6;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 8%;
            background: var(--bg-color);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-img { height: 40px; width: auto; cursor: pointer; }

        .nav-links { display: flex; align-items: center; }
        .nav-links a { text-decoration: none; color: var(--muted-text); margin-left: 2rem; font-weight: 500; font-size: 0.9rem; }
        
        #theme-toggle {
            background: var(--border);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-left: 2rem;
            font-size: 1.2rem;
        }

        .hero {
            padding: 80px 8% 60px;
            text-align: center;
            background: var(--hero-bg);
        }

        .hero h1 { font-size: 3.5rem; font-weight: 800; letter-spacing: -3px; margin-bottom: 15px; }
        .hero p { color: var(--muted-text); font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px; }

        .badge {
            display: inline-block;
            background: var(--border);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .store-section { padding: 40px 8% 100px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            border-color: var(--primary-text);
            transform: translateY(-4px);
        }

        .status-tag {
            font-size: 0.65rem;
            background: #e1ffeb;
            color: #1b8d45;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            margin-left: 8px;
        }

        .btn-get {
            display: inline-block;
            padding: 12px 28px;
            background: var(--primary-text);
            color: var(--bg-color);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 25px;
            text-align: center;
            cursor: pointer;
            border: none;
            width: 100%;
        }

        #store-install-banner {
            display: none;
            background: var(--accent-blue);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 2000;
        }

        @media (max-width: 850px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="store-install-banner" onclick="installStore()">
        📥 Add MyWeb Store to your Home Screen!
    </div>

    <nav>
        <div class="nav-left">
            <img src="MYWEB!.png" alt="MyWeb" class="logo-img" id="main-logo" onclick="window.location.href='index.html'">
        </div>
        <div class="nav-links">
            <a href="#">Developer Portal</a>
            <button id="theme-toggle">🌓</button>
        </div>
    </nav>

    <header class="hero">
        <span class="badge">Official App Store</span>
        <h1>The Ecosystem.</h1>
        <p>Directly install MyWeb applications to your home screen.</p>
    </header>

    <section class="store-section">
        <h2 style="margin-bottom: 35px; letter-spacing: -1.5px; font-size: 2rem;">Available Apps</h2>
        
        <div class="grid" id="app-grid">
            </div>
    </section>

    <script>
        // --- 1. CONFIGURATION ---
        const apps = [
            { 
                name: "Note Taker", 
                desc: "Secure, cloud-synced markdown notes.", 
                // UPDATED PATH TO YOUR GITHUB PAGES LINK
                path: "https://my-webhosting.github.io/Main/notes/", 
                status: "Live"
            },
            { name: "WeatherHub", desc: "Pure black weather interface.", path: "#", status: "Coming Soon" },
            { name: "Code Snippets", desc: "Library for your MyCode snippets.", path: "#", status: "Beta" },
            { name: "Asset Manager", desc: "3D asset cloud storage.", path: "#", status: "Live" }
        ];

        // --- 2. RENDER ---
        const grid = document.getElementById('app-grid');
        apps.forEach(app => {
            const isLive = app.status !== "Coming Soon";
            grid.innerHTML += `
                <div class="card">
                    <div>
                        <div style="display: flex; align-items: center; margin-bottom: 10px;">
                            <h3 style="font-size: 1.4rem;">${app.name}</h3>
                            <span class="status-tag">${app.status}</span>
                        </div>
                        <p style="color: var(--muted-text);">${app.desc}</p>
                    </div>
                    <button class="btn-get" 
                            style="${isLive ? '' : 'opacity: 0.5; cursor: not-allowed;'}" 
                            onclick="${isLive ? `directInstall('${app.path}')` : ''}">
                        ${isLive ? 'Get App' : 'Planned'}
                    </button>
                </div>
            `;
        });

        // --- 3. DIRECT INSTALL BRIDGE ---
        function directInstall(path) {
            if (!path || path === "#") return;
            
            // This opens your notes URL with the ?direct=true flag
            // Ensure your notes/index.html has the listener we wrote earlier!
            window.open(
                path + "?direct=true", 
                "MyWebInstaller", 
                "width=450,height=600,left=100,top=100"
            );
        }

        // --- 4. STORE INSTALLATION ---
        let deferredPrompt;
        const installBanner = document.getElementById('store-install-banner');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.style.display = 'block';
        });

        async function installStore() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBanner.style.display = 'none';
            }
            deferredPrompt = null;
        }

        // --- 5. THEME ENGINE ---
        const toggleBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const logo = document.getElementById('main-logo');

        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            logo.src = (theme === 'dark') ? 'MYWEB2!.png' : 'MYWEB!.png';
        }

        setTheme(localStorage.getItem('theme') || 'light');

        toggleBtn.addEventListener('click', () => {
            const current = html.getAttribute('data-theme');
            setTheme(current === 'light' ? 'dark' : 'light');
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
