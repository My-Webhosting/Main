<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWeb Notes</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="../img/Notes.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #000000;
            --card: #111111;
            --text: #ffffff;
            --accent: #2563eb;
            --border: #222222;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* --- Installer Bridge Overlay --- */
        #installer-overlay {
            display: none; 
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .install-card {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--border);
            max-width: 320px;
        }

        .btn-confirm {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        /* --- Main App UI --- */
        header {
            padding: 20px 8%;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 40px 8%;
            overflow-y: auto;
        }

        .note {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
            min-height: 150px;
        }
    </style>
</head>
<body>

    <div id="installer-overlay">
        <div class="install-card">
            <img src="../img/Notes.png" width="80" style="border-radius: 15px; margin-bottom: 15px;">
            <h2>Install Notes</h2>
            <p style="color: #888;">Add MyWeb Notes to your home screen to start creating.</p>
            <button class="btn-confirm" id="confirm-btn">Install Now</button>
        </div>
    </div>

    <header>
        <h1 style="font-size: 1.5rem; letter-spacing: -1px;">MyWeb Notes</h1>
        <button id="add-note" style="background:none; border:1px solid var(--border); color:white; padding:8px 15px; border-radius:6px; cursor:pointer;">+ New Note</button>
    </header>

    <main class="notes-grid" id="notes-container">
        </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const isInstallMode = urlParams.get('direct') === 'true';
        const overlay = document.getElementById('installer-overlay');
        const confirmBtn = document.getElementById('confirm-btn');

        // --- PWA INSTALLATION LOGIC ---
        if (isInstallMode) {
            overlay.style.display = 'flex';
            let deferredPrompt;

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
            });

            confirmBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`Installation ${outcome}`);
                    setTimeout(() => window.close(), 500);
                } else {
                    alert("App is already installed or your browser doesn't support installation.");
                    window.close();
                }
            });
        }

        // --- APPWRITE / APP LOGIC ---
        // We only run this if we are NOT in the middle of installing
        if (!isInstallMode) {
            console.log("App running in standard mode. Initializing Appwrite...");
            initApp();
        }

        function initApp() {
            // Put your Appwrite initialization and note-fetching code here
            // Example: client.setEndpoint('...').setProject('...');
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW Active'))
                .catch(err => console.log('SW Error', err));
            });
        }
    </script>
</body>
</html>
